name: moodiary_desktop
description: "Selume diary app for Windows."
publish_to: "none"
version: 1.0.0+97

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  code_assets: 1.2.1
  hooks: 2.2.0
  fast_image: 0.0.1
  moodiary_assistant: 0.0.1
  moodiary_components: 0.0.1
  moodiary_data: 0.0.1
  moodiary_di: 0.0.1
  moodiary_diary: 0.0.1
  moodiary_editor: 0.0.1
  moodiary_export: 0.0.1
  moodiary_files: 0.0.1
  moodiary_http: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_lock: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_media: 0.0.1
  moodiary_migration: 0.0.1
  moodiary_ml: 0.0.1
  moodiary_models: 0.0.1
  moodiary_platform: 0.0.1
  moodiary_preferences: 0.0.1
  moodiary_router: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_sync: 0.0.1
  moodiary_theme: 0.0.1
  moodiary_utils: 0.0.1
  mui: 0.0.1
  file_picker: 12.2.0
  flutter_riverpod: 3.4.3
  injectable: 3.0.0
  intl: 0.20.3
  gap: 3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.1
  injectable_generator: 3.1.3
  moodiary_lint: 0.0.1

flutter:
  uses-material-design: true
  assets:
    # Generated by hook/build.dart before packaging.
    # ignore: asset_directory_does_not_exist
    - assets/licenses/
