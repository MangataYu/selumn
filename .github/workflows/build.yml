name: Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a draft release after building
        type: boolean
        default: false
      prerelease:
        description: Publish a test pre-release after building (takes priority over create_release)
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build APK

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set Up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read Flutter Version
        id: flutter_version
        run: |
          if [ -f .fvmrc ]; then
            FLUTTER_VERSION=$(cat .fvmrc | jq -r '.flutter')
            echo "Flutter version detected: $FLUTTER_VERSION"
            echo "flutter-version=$FLUTTER_VERSION" >> $GITHUB_ENV
          else
            echo ".fvmrc not found. Defaulting to latest Flutter version."
            echo "flutter-version=stable" >> $GITHUB_ENV
          fi

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set Up Rust
        working-directory: packages/foundation/fast_image/rust
        run: rustup show active-toolchain

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Decode Keystore
        env:
          ANDROID_KJS: ${{ secrets.ANDROID_KJS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KJS ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required signing secret: $name" >&2
              exit 1
            fi
          done
          if ! printf '%s' "$ANDROID_KJS" | base64 --decode > mobile/android/app/key.jks; then
            echo "ANDROID_KJS must contain a valid Base64-encoded keystore" >&2
            exit 1
          fi
          if ! keytool -list -keystore mobile/android/app/key.jks \
            -storepass:env ANDROID_STORE_PASSWORD -alias key0 > /dev/null 2>&1; then
            echo "Unable to open the signing keystore or find alias key0" >&2
            exit 1
          fi

      - name: Build APK
        working-directory: mobile
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=splitMap

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true || inputs.prerelease == true
    runs-on: ubuntu-latest
    name: Publish Release
    needs: [ build-apk ]
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Resolve Release Metadata
        id: release_metadata
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' mobile/pubspec.yaml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "could not read version from mobile/pubspec.yaml" >&2
            exit 1
          fi
          release_tag="v$version"
          artifact_version="$version"
          if [ "$RELEASE_EVENT_NAME" = "push" ] && [ "$RELEASE_REF_TYPE" = "tag" ] && [ "$RELEASE_REF_NAME" != "$release_tag" ]; then
            echo "Pushed tag must match the pubspec version: $release_tag; use workflow_dispatch with prerelease for test releases" >&2
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            release_tag="$release_tag-selume-test.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            artifact_version="$release_tag"
          fi
          echo "Version detected: $version"
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"

      - name: Rename Artifacts
        env:
          ARTIFACT_VERSION: ${{ steps.release_metadata.outputs.artifact_version }}
        run: |
          mkdir -p renamed-artifacts
          mv artifacts/android/app-release.apk "renamed-artifacts/selume-$ARTIFACT_VERSION-android-arm64.apk"

      - name: Extract Release Notes From Changelog
        if: inputs.prerelease != true
        run: |
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no [$VERSION] section in CHANGELOG.md" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Write Pre-release Notes
        if: inputs.prerelease == true
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '%s\n\n' 'Selume Android CI test pre-release.'
            printf '%s\n\n' 'This signed ARM64 APK is for testing the build and installation flow.'
            printf 'Commit: `%s`\n\n' "$RELEASE_SHA"
            printf 'Build: %s\n' "$RELEASE_RUN_URL"
          } > release-notes.md

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: renamed-artifacts/*
          tag: ${{ steps.release_metadata.outputs.tag }}
          name: ${{ steps.release_metadata.outputs.tag }}
          bodyFile: release-notes.md
          commit: ${{ github.sha }}
          draft: ${{ inputs.prerelease != true }}
          prerelease: ${{ inputs.prerelease == true }}
          makeLatest: ${{ inputs.prerelease == true && 'false' || 'legacy' }}
          immutableCreate: ${{ inputs.prerelease == true }}
          artifactErrorsFailBuild: ${{ inputs.prerelease == true }}
          allowUpdates: ${{ inputs.prerelease != true }}
          token: ${{ secrets.GITHUB_TOKEN }}
