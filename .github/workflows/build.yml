name: Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a draft release after building
        type: boolean
        default: false
      prerelease:
        description: Publish a test pre-release after building (takes priority over create_release)
        type: boolean
        default: false
      publish_release:
        description: Publish a new stable release after building and uploading its APK
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build APK
    env:
      EXPECTED_CERT_SHA256: 5ea24c807f714aa6701ec4106756198b7a0e76627e51448829dc3a5585ce131e

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read Flutter Version
        id: flutter_version
        run: |
          if [ -f .fvmrc ]; then
            FLUTTER_VERSION=$(cat .fvmrc | jq -r '.flutter')
            echo "Flutter version detected: $FLUTTER_VERSION"
            echo "flutter-version=$FLUTTER_VERSION" >> $GITHUB_ENV
          else
            echo ".fvmrc not found. Defaulting to latest Flutter version."
            echo "flutter-version=stable" >> $GITHUB_ENV
          fi

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set Up Rust
        working-directory: packages/foundation/fast_image/rust
        run: rustup show active-toolchain

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Prepare Android signing
        env:
          ANDROID_KJS: ${{ secrets.ANDROID_KJS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERIFY_STABLE_KEY: ${{ inputs.publish_release == true && inputs.prerelease != true }}
        run: |
          for name in ANDROID_KJS ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required signing secret: $name" >&2
              exit 1
            fi
          done
          if ! printf '%s' "$ANDROID_KJS" | base64 --decode > mobile/android/app/key.jks; then
            echo "ANDROID_KJS must contain a valid Base64-encoded keystore" >&2
            exit 1
          fi
          if ! keytool -list -keystore mobile/android/app/key.jks \
            -storepass:env ANDROID_STORE_PASSWORD -alias key0 > /dev/null 2>&1; then
            echo "Unable to open the signing keystore or find alias key0" >&2
            exit 1
          fi
          if [ "$VERIFY_STABLE_KEY" = "true" ]; then
            certificate=$(keytool -exportcert -keystore mobile/android/app/key.jks \
              -storepass:env ANDROID_STORE_PASSWORD -alias key0 | sha256sum | cut -d ' ' -f 1)
            if [ "$certificate" != "$EXPECTED_CERT_SHA256" ]; then
              echo "Signing key certificate does not match the previous release: $certificate" >&2
              exit 1
            fi
          fi

      - name: Build APK
        working-directory: mobile
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --flavor production --release --target-platform android-arm64 --obfuscate --split-debug-info=splitMap

      - name: Verify stable APK identity and signature
        if: inputs.publish_release == true && inputs.prerelease != true
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=mobile/build/app/outputs/flutter-apk/app-production-release.apk
          certificate=$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$certificate" != "$EXPECTED_CERT_SHA256" ]; then
            echo "APK signing certificate does not match the previous release: ${certificate:-<empty>}" >&2
            exit 1
          fi
          version=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' mobile/pubspec.yaml)
          version_code=$(sed -n 's/^version: [0-9.]*+\([0-9]*\).*/\1/p' mobile/pubspec.yaml)
          badging=$("$build_tools/aapt" dump badging "$apk")
          if ! grep -F "package: name='com.aerieyarrowy.selume' versionCode='$version_code' versionName='$version'" <<< "$badging" > /dev/null ||
             ! grep -Fx "native-code: 'arm64-v8a'" <<< "$badging" > /dev/null; then
            echo "APK package, version, or native architecture is not the expected release" >&2
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-production-release.apk

      - name: Upload APK after verification failure
        if: failure() && inputs.publish_release == true && inputs.prerelease != true
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-verification-failed
          path: mobile/build/app/outputs/flutter-apk/app-production-release.apk
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true || inputs.prerelease == true || inputs.publish_release == true
    runs-on: ubuntu-latest
    name: Publish Release
    needs: [ build-apk ]
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Resolve Release Metadata
        id: release_metadata
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' mobile/pubspec.yaml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "could not read version from mobile/pubspec.yaml" >&2
            exit 1
          fi
          release_tag="v$version"
          artifact_version="$version"
          if [ "$RELEASE_EVENT_NAME" = "push" ] && [ "$RELEASE_REF_TYPE" = "tag" ] && [ "$RELEASE_REF_NAME" != "$release_tag" ]; then
            echo "Pushed tag must match the pubspec version: $release_tag; use workflow_dispatch with prerelease for test releases" >&2
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            release_tag="$release_tag-selume-test.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            artifact_version="$release_tag"
          fi
          echo "Version detected: $version"
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"

      - name: Ensure stable release tag is new
        if: inputs.publish_release == true && inputs.prerelease != true
        env:
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Release tag $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo "Could not check remote release tag $RELEASE_TAG" >&2
            exit "$status"
          fi

      - name: Rename Artifacts
        env:
          ARTIFACT_VERSION: ${{ steps.release_metadata.outputs.artifact_version }}
        run: |
          mkdir -p renamed-artifacts
          mv artifacts/android/app-production-release.apk "renamed-artifacts/selume-$ARTIFACT_VERSION-android-arm64.apk"

      - name: Extract Release Notes From Changelog
        if: inputs.prerelease != true
        run: |
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no [$VERSION] section in CHANGELOG.md" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Write Pre-release Notes
        if: inputs.prerelease == true
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '%s\n\n' 'Selume Android CI test pre-release.'
            printf '%s\n\n' 'This signed ARM64 APK is for testing the build and installation flow.'
            printf 'Commit: `%s`\n\n' "$RELEASE_SHA"
            printf 'Build: %s\n' "$RELEASE_RUN_URL"
          } > release-notes.md

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          artifacts: renamed-artifacts/*
          tag: ${{ steps.release_metadata.outputs.tag }}
          name: ${{ steps.release_metadata.outputs.tag }}
          bodyFile: release-notes.md
          commit: ${{ github.sha }}
          draft: ${{ inputs.prerelease != true }}
          prerelease: ${{ inputs.prerelease == true }}
          makeLatest: ${{ inputs.prerelease == true && 'false' || 'legacy' }}
          immutableCreate: ${{ inputs.prerelease == true }}
          artifactErrorsFailBuild: ${{ inputs.prerelease == true || inputs.publish_release == true }}
          allowUpdates: ${{ inputs.prerelease != true && inputs.publish_release != true }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable release
        if: inputs.publish_release == true && inputs.prerelease != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
        run: |
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "Release action did not return a valid release ID" >&2
            exit 1
          fi
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          if ! jq -e --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" --arg asset "selume-$VERSION-android-arm64.apk" '
            .draft == true and .prerelease == false and .target_commitish == $sha and .tag_name == $tag and
            any(.assets[]; .name == $asset and .state == "uploaded" and .size > 0)
          ' <<< "$release" > /dev/null; then
            echo "Draft release does not have the expected commit and uploaded APK" >&2
            exit 1
          fi
          # Create the ref atomically: a competing tag must never redirect the release.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA" --silent
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --silent
